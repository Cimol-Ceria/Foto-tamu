<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri Foto Tamu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📸 Galeri Foto Tamu</h1>
    <p>Upload foto kamu, dan unduh foto kenangan lainnya!</p>
  </header>

  <main>
    <section class="upload-box">
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <button id="uploadBtn" class="btn-primary">+ Upload Foto</button>
      <p id="status"></p>
    </section>

    <section>
      <div id="gallery" class="gallery"></div>
      <p id="empty" class="empty" hidden>Belum ada foto. Jadilah yang pertama upload!</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
